<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPG prototypy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: black page, a wrapping row of white square tiles, one per prototype version. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --fg: #f4f4f4;
  --dim: #8a909c;
  --tile: #ffffff;
  --tile-fg: #010614;
  --font: "Source Sans 3", "Source Sans Pro", "Segoe UI", Roboto, Arial, sans-serif;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
main { max-width: 1100px; margin: 0 auto; padding-block: 56px; display: flex; flex-direction: column; gap: 32px; }
h1 { margin: 0; font-size: 28px; font-weight: 600; text-wrap: balance; }
p { margin: 0; color: var(--dim); font-size: 16px; }
.tiles { display: flex; flex-wrap: wrap; gap: 24px; }
.tile {
  width: 200px; max-width: 100%; aspect-ratio: 1; background: var(--tile); color: var(--tile-fg);
  border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between;
  padding: 20px; box-sizing: border-box; transition: transform 150ms ease, box-shadow 150ms ease; outline: none;
}
.tile .l { font-size: 96px; line-height: 1; font-weight: 700; }
.tile .n { font-size: 16px; font-weight: 600; }
.tile:hover, .tile:focus-visible { transform: scale(1.04); box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--tile); }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<main>
  <div>
    <h1>TV program – verze prototypu</h1>
    <p>Vyberte verzi. V prototypu se ovládá šipkami, Enterem a Backspace / Esc.</p>
  </div>
  <nav class="tiles" id="tiles">
    <a class="tile" href="a.html"><span class="l">A</span><span class="n">Verze A</span></a>
    <a class="tile" href="b.html"><span class="l">B</span><span class="n">Verze B</span></a>
    <a class="tile" href="c.html"><span class="l">C</span><span class="n">Verze C</span></a>
    <a class="tile" href="d.html"><span class="l">D</span><span class="n">Verze D</span></a>
    <a class="tile" href="e.html"><span class="l">E</span><span class="n">Verze E</span></a>
  </nav>
</main>

<script>
// Arrow keys + Enter also work here, so the hub can be driven like a TV.
(() => {
  const tiles = [...document.querySelectorAll('.tile')];
  tiles[0].focus();
  document.addEventListener('keydown', e => {
    const i = tiles.indexOf(document.activeElement);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); tiles[Math.min(tiles.length - 1, i + 1)].focus(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); tiles[Math.max(0, i - 1)].focus(); }
  });
})();
</script>
</body>
</html>
