<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV program – verze C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: 1280×720 TV stage scaled to fit the window; single dark look taken from the Figma design. */
:root {
  color-scheme: dark;
  --bg: #010d1f;
  --page: #00060f;
  --fg: #f4f4f4;
  --fg-dim: #b6bec8;
  --time: #bcc9f8;
  --item: rgba(255,255,255,0.08);
  --item-now: rgba(255,255,255,0.2);
  --focus-bg: #f4f4f4;
  --focus-fg: #010614;
  --selected: #b9cafc;
  --btn: rgba(255,255,255,0.15);
  --red: #ed1c24;
  --font: "Source Sans 3", "Source Sans Pro", "Segoe UI", Roboto, Arial, sans-serif;
  --dur: 220ms;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--page); color: var(--fg); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
}
#app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; box-sizing: border-box; }
#fit { flex: 1; min-height: 0; position: relative; }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; overflow: hidden;
  transform-origin: 0 0; border-radius: 6px;
  background: linear-gradient(160deg, rgba(36,121,231,0.07) 0%, rgba(1,13,31,0) 55%), var(--bg);
  outline: none; user-select: none;
}
.hint { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 14px; color: var(--fg-dim); }
.hint .hub { color: var(--fg); text-decoration: none; font-weight: 600; }
.hint .hub:hover { text-decoration: underline; }
.hint .ver { color: var(--fg); font-weight: 600; }
.hint kbd { font-family: var(--font); font-weight: 600; color: var(--fg); background: rgba(255,255,255,0.1); border-radius: 4px; padding: 1px 7px; }
#clickhint { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 50; background: #f4f4f4; color: #010614; padding: 18px 28px; border-radius: 8px; font-size: 22px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 40px rgba(0,0,0,.5); }

/* Header */
.header { position: absolute; left: 32px; top: 28px; width: 1216px; height: 64px; display: flex; align-items: center; gap: 32px; }
.hbtn { border-radius: 4px; color: var(--fg); font-weight: 600; display: flex; align-items: center; justify-content: center; box-sizing: border-box; white-space: nowrap; }
.hbtn.back { width: 113px; height: 52px; gap: 12px; padding: 12px 16px; background: var(--btn); font-size: 22px; line-height: 28px; color: #fff; }
.hbtn svg { width: 24px; height: 24px; flex: none; }
.days { display: flex; gap: 4px; height: 64px; }
.day { width: 60px; flex-direction: column; gap: 1px; font-size: 16px; padding: 9px 12px 12px; align-items: flex-start; }
.day .d1 { font-weight: 600; line-height: 22px; color: var(--fg-dim); }
.day .d2 { font-weight: 400; color: var(--time); }
.day.sel { background: var(--selected); border-radius: 8px; }
.day.sel .d1 { color: var(--focus-fg); } .day.sel .d2 { color: #3a4057; }
.hbtn.other { gap: 6px; padding: 11px 16px 13px; font-size: 18px; line-height: 24px; height: 64px; }
.divider { width: 1px; height: 64px; background: rgba(255,255,255,0.16); }
.anchors { flex: 1; display: flex; gap: 4px; height: 48px; }
.anchor { flex: 1; font-size: 18px; line-height: 24px; color: #fff; }
.hbtn.f, .day.f { background: var(--focus-bg) !important; }
.hbtn.f, .hbtn.f .d1, .hbtn.f .d2 { color: var(--focus-fg) !important; }
.hbtn.f svg path { fill: var(--focus-fg); }

/* Time layer + grid */
.timelayer { position: absolute; left: 157px; top: 124px; width: 1123px; height: 596px; overflow: hidden; pointer-events: none; z-index: 5; }
.grid { position: absolute; left: 157px; top: 160px; width: 1123px; height: 560px; overflow: hidden; }
.chcol { position: absolute; left: 32px; top: 160px; width: 120px; height: 560px; overflow: hidden; }
.track { position: absolute; left: 0; top: 0; height: 100%; transition: transform var(--dur) ease; will-change: transform; }
.rows, .logos { position: absolute; left: 0; top: 0; width: 100%; transition: transform var(--dur) ease; }
.hour { position: absolute; top: 4px; font-size: 16px; line-height: 20px; color: var(--fg-dim); }
.nowlbl { position: absolute; top: 2px; height: 25px; transform: translateX(-50%); background: #fff; color: #010d1f; border-radius: 4px; padding: 2px 8px; box-sizing: border-box; font-size: 16px; line-height: 21px; letter-spacing: .2px; }
.nowarrow { position: absolute; top: 27px; width: 12px; height: 6px; transform: translateX(-50%); }
.nowline { position: absolute; top: 27px; bottom: 0; width: 2px; transform: translateX(-50%); background: #fff; }

/* Version C: whole-channel background behind all ČT sport Plus lanes (Figma: #d9d9d9 at 10 %, radius 5) */
.chbg { position: absolute; left: 0; width: 100%; border-radius: 5px; background: rgba(217,217,217,0.1); transition: top var(--dur) ease, height var(--dur) ease; }
.chrow { position: absolute; left: 0; width: 100%; transition: top var(--dur) ease, height var(--dur) ease; }
.lane { position: absolute; left: 0; height: 92px; width: 100%; transition: top var(--dur) ease, opacity var(--dur) ease; }
.lane.off { opacity: 0; }
.it { position: absolute; top: 0; width: var(--w); height: 92px; overflow: hidden; border-radius: 4px; background: var(--item); }
/* focused short programme grows to fit its description */
.it.f:not(.gap) { width: max-content; min-width: var(--w); max-width: max(var(--w), 420px); height: auto; min-height: 92px; z-index: 3; }
.it.f:not(.gap) .se, .it.f:not(.gap) .ti { min-width: 0; }
.it.f:not(.gap) .in { padding-bottom: 12px; }
.av { display: none; padding-top: 4px; }
.av span { display: inline-block; background: #c3c6cc; color: #000; border-radius: 2px; padding: 4px 8px; font-size: 16px; line-height: 21px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
.it.f .av { display: block; }
.it.now { background: var(--item-now); }
.it.cut { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.it.f { background: var(--focus-bg); z-index: 2; }
.in { padding: 8px 12px; box-sizing: border-box; transition: transform var(--dur) ease; }
.top { display: flex; align-items: center; gap: 8px; min-width: 136px; height: 20px; }
.tm { flex: 1; font-size: 16px; color: var(--time); white-space: nowrap; }
.se { font-size: 18px; line-height: 24px; font-weight: 600; text-transform: uppercase; opacity: .7; white-space: nowrap; min-width: 160px; }
.ti { font-size: 18px; line-height: 24px; font-weight: 600; min-width: 160px; }
.it.f .tm, .it.f .se, .it.f .ti { color: var(--focus-fg); }
.ic { width: 20px; height: 20px; position: relative; flex: none; }
.ic::before { content: ""; position: absolute; inset: 16.67% 4.17%; border-radius: 8px; background: rgba(244,244,244,0.5); }
.ic svg { position: absolute; left: 29.17%; top: 29.17%; width: 41.66%; height: 41.66%; }
.ic svg path { fill: #2a323f; }
.ic.x::before { background: none; border: 1px solid rgba(255,255,255,0.5); }
.ic.x svg path { fill: rgba(255,255,255,0.5); }
.it.f .ic::before { background: var(--red); }
.it.f .ic svg path { fill: #fff; }
.it.f .ic.x::before { background: none; border-color: rgba(1,6,20,0.45); }
.it.f .ic.x svg path { fill: rgba(1,6,20,0.45); }
.gap .gt { position: absolute; top: 34px; transform: translateX(-50%); font-size: 18px; line-height: 24px; white-space: nowrap; color: var(--fg); }
.gap.f .gt { color: var(--focus-fg); }
.logo { position: absolute; left: 0; height: 20px; transition: top var(--dur) ease; }
.logo svg { height: 20px; width: auto; display: block; }

/* Detail overlay */
.ov { position: absolute; inset: 0; z-index: 20; background: rgba(1,6,20,0.82); display: flex; align-items: center; justify-content: center; }
.card { width: 760px; background: #0c1a33; border-radius: 8px; padding: 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
.card .meta { display: flex; align-items: center; gap: 16px; color: var(--time); font-size: 18px; }
.card .meta svg { height: 22px; width: auto; }
.card .cse { font-size: 20px; font-weight: 600; text-transform: uppercase; opacity: .7; letter-spacing: .3px; }
.card h2 { margin: 0; font-size: 36px; line-height: 42px; font-weight: 600; text-wrap: balance; }
.card .st { font-size: 18px; color: var(--fg-dim); }
.card .btns { display: flex; gap: 12px; margin-top: 18px; }
.card .btns .hbtn { height: 52px; padding: 12px 28px; background: var(--btn); font-size: 20px; }
.toast { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); background: #f4f4f4; color: var(--focus-fg); font-size: 18px; font-weight: 600; padding: 12px 22px; border-radius: 6px; z-index: 30; transition: opacity 200ms; }
.toast.hide { opacity: 0; }
@media (prefers-reduced-motion: reduce) { :root { --dur: 0ms; } }
</style>

</head>
<body>
<div id="app">
  <div id="fit">
    <div id="stage" tabindex="0" aria-label="Prototyp TV programu">
      <div class="header" id="header"></div>
      <div class="chcol"><div class="logos" id="logos"></div></div>
      <div class="grid"><div class="rows" id="rows"><div class="chbg" id="spbg"></div><div class="track" id="gtrack"></div></div></div>
      <div class="timelayer"><div class="track" id="ttrack"></div></div>
      <div class="ov" id="ov" hidden></div>
      <div class="toast hide" id="toast"></div>
      <div id="clickhint" hidden>Klikněte sem a ovládejte klávesnicí</div>
    </div>
  </div>
  <div class="hint">
    <a class="hub" href="index.html">← Všechny verze</a>
    <span class="ver">Verze C</span>
    <span><kbd>←</kbd> <kbd>→</kbd> pořady v čase</span>
    <span><kbd>↑</kbd> <kbd>↓</kbd> kanály</span>
    <span><kbd>Enter</kbd> potvrdit</span>
    <span><kbd>Backspace</kbd> / <kbd>Esc</kbd> zpět</span>
  </div>
</div>

function fill(list, from, to, pool, r) {

    fill(ch.ct2, hm('18:05'), DAY, POOLS.ct2, r);
    ch.sport = fill([], 0, hm('10:40'), POOLS.sport, r);
    ch.sport.push(P('10:40', '12:00', 'ATLETIKA', 'Diamantová liga – Řím'), P('12:00', '12:25', '', 'Panorama'), P('12:25', '12:35', '', 'Sportovní zprávy'), P('12:35', '13:20', '', 'Český orienťák'), P('13:20', '14:30', 'ICF WORLD RANKING RACE 2026', 'ICR WRR Skupiny ČEZ Praha'), P('14:30', '16:30', 'FORTUNA LYGA 2027', 'AC Sparta Praha – Prague Raptors FC'), P('16:30', '18:00', 'CZECH TOUR 2026', '4. etapa'), P('18:00', '19:00', 'MS V JEZDECTVÍ 2026', 'MS Německo'));
    fill(ch.sport, hm('19:00'), DAY, POOLS.sport, r);
  } else {
    ch.ct2 = fill([], 0, DAY, POOLS.ct2, r);
    ch.sport = fill([], 0, DAY, POOLS.sport, r);
  }
  ch.ct24 = ct24(dayIdx);
  const ex = today && ch.ct24.find(p => p.start === hm('13:33'));
  ch.dart = fill([], hm('06:00'), hm('20:00'), POOLS.kids, r);
  ch.dart.unshift(P(0, hm('06:00'), '', 'Noční vysílání ČT art'));
  fill(ch.dart, hm('20:00'), DAY, POOLS.art, r);
  if (today) {
    ch.sportplus = [P('09:00', '10:45', 'HÁZENÁ', 'Chance extraliga: Plzeň – Karviná'), P('10:00', '11:30', 'STOLNÍ TENIS', 'MČR družstev'), P('13:00', '14:58', 'KRASOBRUSLENÍ', 'Kanadská brusle: volné jízdy mužů'), P('13:40', '15:50', 'CHANCE EXTRALIGA 2026/27', 'HC Zubří – HC Dukla Praha'), P('17:10', '19:00', 'FLORBAL', 'Superliga: Vítkovice – Mladá Boleslav'), P('19:30', '21:30', 'VOLEJBAL', 'Extraliga žen: Olomouc – Prostějov'), P('20:00', '21:45', 'BASKETBAL', 'Kooperativa NBL: Nymburk – Opava'), P('20:15', '21:15', 'ŠERM', 'MČR – finále')];
    ch.ivys = [P('15:40', '17:00', 'MASTERCLASS PROJEKTU IDENTITA', 'Identita učebnic')]; // version C: a single programme
  } else {
    const gen = (pool, n) => { const out = []; for (let i = 0; i < n; i++) { const p = pool[Math.floor(r() * pool.length)]; const s = Math.round((480 + r() * 780) / 5) * 5; out.push(P(s, Math.min(DAY, s + p[2]), p[0], p[1])); } return out.sort((a, b) => a.start - b.start); };
    ch.sportplus = gen(POOLS.splus, 5);
    ch.ivys = gen(POOLS.ivys, 1).filter((p, i, a) => !a.slice(0, i).some(q => q.end > p.start)); // version B: iVysílání has a single row
  }
  if (ex) { ex.forceAvail = '12. 6.'; }
  for (const k in ch) for (const p of ch[k]) {
    const past = !today || p.start < NOW || dayIdx < TODAY;
    p.playable = past ? r() < 0.85 : r() < 0.4;
    if (p.forceAvail) { p.playable = true; p.avail = p.forceAvail; continue; }
    if (p.playable && r() < 0.3) { const d = new Date(2026, 5, 1 + 3 + Math.floor(r() * 28)); p.avail = d.getDate() + '. ' + (d.getMonth() + 1) + '.'; }
  }
  return ch;
}

const CHANNELS = [
  { id: 'ct1', name: 'ČT1', logos: [L.ct1] },
  { id: 'ct2', name: 'ČT2', logos: [L.ct2] },
  { id: 'ct24', name: 'ČT24', logos: [L.ct24] },
  { id: 'sport', name: 'ČT sport', logos: [L.sport] },
  { id: 'dart', name: 'ČT :D / ČT art', logos: [L.d, L.art] },
  { id: 'sportplus', name: 'ČT sport Plus', logos: [L.sportplus], nonlinear: true },
  { id: 'ivys', name: 'iVysílání', logos: [L.ivys], nonlinear: true }
];

/* ---------- Model ---------- */
let chans = [];   // [{def, lanes:[[item]], laneCount, top, height}]
function buildModel(dayIdx) {
  const progs = buildPrograms(dayIdx);
  chans = CHANNELS.map((def, ci) => {
    const list = progs[def.id].slice().sort((a, b) => a.start - b.start);
    let lanes;
    if (!def.nonlinear) {
      lanes = [list.map(p => ({ ...p, kind: 'prog' }))];
    } else {
      const ends = [], laneProgs = [];
      for (const p of list) {
        let l = ends.findIndex(e => e <= p.start);
        if (l < 0) { l = ends.length; ends.push(0); laneProgs.push([]); }
        ends[l] = p.end; p.lane = l; laneProgs[l].push(p);
      }
      if (!laneProgs.length) laneProgs.push([]);
      lanes = laneProgs.map(lp => {
        const out = []; let t = 0;
        // Version C: no 'V tento čas nevysíláme' placeholders – a lane holds only programmes
        for (const p of lp) { out.push({ ...p, kind: 'prog' }); t = p.end; }
        return out;
      });
    }
    lanes.forEach((items, li) => items.forEach((it, ii) => { it.ch = ci; it.lane = li; it.idx = ii; }));
    return { def, lanes, laneCount: 1, top: 0, height: ROW_H };
  });
}

/* ---------- State ---------- */
const S = {
  day: TODAY, vs: 0, scrollY: 0,
  area: 'grid', ch: 0, lane: 0, item: null, ref: NOW,
  hIdx: 0, overlay: null, ovIdx: 0, lastGrid: { ch: 0, lane: 0 }
};
const defaultVs = t => clamp(Math.floor(t / 30) * 30 - 30, 0, DAY - SPAN);
const isToday = () => S.day === TODAY;
const vEnd = () => S.vs + SPAN;
// programme at time t, or the nearest programme in that lane (empty time is skipped)
const itemAt = (ci, li, t) => { const items = chans[ci].lanes[li]; let best = null, bd = Infinity; for (const it of items) { if (it.start <= t && t < it.end) return it; const d = t < it.start ? it.start - t : t - it.end + 1; if (d < bd) { bd = d; best = it; } } return best; };

function computeLayout() {
  const a = S.vs - LANE_MEMORY, b = vEnd();
  let y = 0;
  for (const c of chans) {
    if (c.def.nonlinear) {
      let max = 0;
      // Version B: a non-linear row always shows every lane the day needs (it never shrinks)
      c.laneCount = c.lanes.length;
    } else c.laneCount = 1;
    c.top = y; c.height = c.laneCount * ROW_H + (c.laneCount - 1) * GAP;
    y += c.height + GAP;
  }
  S.totalH = y - GAP;
  // focused lane collapsed -> move focus to first lane of the channel
  if (S.item && S.lane >= chans[S.ch].laneCount) { S.lane = 0; S.item = itemAt(S.ch, 0, clamp(S.ref, S.vs, vEnd() - 1)); }
}

function ensureVisibleH(it, dir) {
  const len = it.end - it.start; let vs = S.vs; const ve = vs + SPAN;
  if (it.kind === 'gap') {
    if (it.end <= vs || it.start >= ve) vs = dir > 0 ? it.start : it.end - SPAN;
  } else if (dir > 0) {
    if (it.start >= ve || it.end > ve) vs = len <= SPAN - LEAD ? it.end - SPAN : it.start - LEAD;
    if (it.start < vs) vs = it.start - LEAD;
  } else {
    if (it.start < vs) vs = len <= SPAN - LEAD ? it.start - LEAD : it.end - SPAN;
  }
  S.vs = clamp(vs, 0, DAY - SPAN);
}
function ensureVisibleV(it) {
  const len = it.end - it.start; let vs = S.vs; const ve = vs + SPAN;
  if (it.end <= vs || it.start >= ve) vs = it.kind === 'gap' ? clamp(S.ref - SPAN / 2, it.start, Math.max(it.start, it.end - SPAN)) : it.start - LEAD;
  else if (it.kind === 'prog' && it.start >= vs && it.end > ve) vs = len <= SPAN - LEAD ? it.end - SPAN : it.start - LEAD;
  S.vs = clamp(vs, 0, DAY - SPAN);
}
function ensureRowVisible() {
  const c = chans[S.ch];
  const y0 = c.top + S.lane * PITCH, y1 = y0 + ROW_H;
  const usable = GRID_H - BOTTOM_PAD;
  let sy = S.scrollY;
  if (S.ch === 0 && S.lane === 0) sy = 0;
  if (y0 < sy) sy = y0;
  if (y1 > sy + usable) sy = y1 - usable;
  S.scrollY = clamp(sy, 0, Math.max(0, S.totalH - usable));
}
/* ---------- Navigation ---------- */
function navRows() { const r = []; chans.forEach((c, ci) => { for (let l = 0; l < c.laneCount; l++) if (c.lanes[l].length) r.push({ ch: ci, lane: l }); }); return r; }

function moveH(dir) {
  const items = chans[S.ch].lanes[S.lane];
  const next = items[S.item.idx + dir];
  if (!next) return;
  S.item = next; S.ch = next.ch; S.lane = next.lane;
  ensureVisibleH(next, dir);
  computeLayout();
  S.ref = clamp(Math.max(next.start, S.vs), S.vs, vEnd() - 1);
  ensureRowVisible();
}
function moveV(dir) {
  const rows = navRows();
  const i = rows.findIndex(r => r.ch === S.ch && r.lane === S.lane);
  if (!rows[i + dir]) { if (dir < 0) { goHeader(); } return; }
  const ref = clamp(S.ref, S.vs, vEnd() - 1);
  // Version C: skip rows that have no programme in the visible time window;
  // only if no row in that direction has one, jump to the nearest programme of the next row
  const vis = r => chans[r.ch].lanes[r.lane].filter(it => it.end > S.vs && it.start < vEnd());
  let t = null, it = null;
  for (let j = i + dir; rows[j]; j += dir) {
    const v = vis(rows[j]);
    if (v.length) { t = rows[j]; it = v.find(x => x.start <= ref && ref < x.end) || v.reduce((a, b) => Math.abs(a.start - ref) <= Math.abs(b.start - ref) ? a : b); break; }
  }
  if (!t) { t = rows[i + dir]; it = itemAt(t.ch, t.lane, ref); }
  S.item = it; S.ch = t.ch; S.lane = t.lane;
  ensureVisibleV(it);
  computeLayout();
  if (S.ref < S.vs || S.ref >= vEnd()) S.ref = clamp(Math.max(it.start, S.vs), S.vs, vEnd() - 1);
  ensureRowVisible();
}
function goHeader() {
  S.lastGrid = { ch: S.ch, lane: S.lane };
  S.area = 'header';
  S.hIdx = 1 + S.day;
}
function enterGrid(ref) {
  S.area = 'grid';
  if (ref != null) S.ref = ref;
  S.ref = clamp(S.ref, S.vs, vEnd() - 1);
  let { ch, lane } = S.lastGrid;
  if (lane >= chans[ch].laneCount) lane = 0;
  S.item = itemAt(ch, lane, S.ref); S.ch = ch; S.lane = lane;
  computeLayout(); ensureRowVisible();
}
function selectDay(d) {
  S.day = d; buildModel(d); buildDOM();
  computeLayout();
  S.item = itemAt(S.lastGrid.ch, Math.min(S.lastGrid.lane, chans[S.lastGrid.ch].laneCount - 1), clamp(S.ref, S.vs, vEnd() - 1));
}

/* ---------- Header ---------- */
const HEAD = [{ k: 'back' }, ...DAYS.map((d, i) => ({ k: 'day', i })), { k: 'other' }, { k: 'anchor', label: 'Teď', t: 'now' }, { k: 'anchor', label: '06:00', t: 360 }, { k: 'anchor', label: '12:00', t: 720 }, { k: 'anchor', label: '16:00', t: 960 }, { k: 'anchor', label: '20:00', t: 1200 }];
function headerEnter() {
  const h = HEAD[S.hIdx];
  if (h.k === 'back') { location.href = 'index.html'; return; }
  if (h.k === 'other') { toast('Výběr jiného data není součástí prototypu'); return; }
  if (h.k === 'day') { selectDay(h.i); return; }
  if (h.k === 'anchor') {
    if (h.t === 'now') { if (!isToday()) selectDay(TODAY); S.vs = defaultVs(NOW); computeLayout(); enterGrid(NOW); }
    else { S.vs = clamp(h.t, 0, DAY - SPAN); computeLayout(); enterGrid(h.t); }
  }
}

/* ---------- Overlay ---------- */
function openDetail(it) {
  const c = chans[it.ch].def;
  const status = !isToday() ? (S.day < TODAY ? 'Odvysíláno' : 'Bude vysíláno') : it.end <= NOW ? 'Odvysíláno' : it.start <= NOW ? 'Právě běží' : 'Bude vysíláno';
  const future = status === 'Bude vysíláno';
  const btns = [];
  if (!future && it.playable) btns.push(status === 'Právě běží' ? 'Sledovat živě' : 'Přehrát');
  if (status === 'Právě běží' && it.playable) btns.push('Přehrát od začátku');
  if (future) btns.push('Připomenout');
  btns.push('Zavřít');
  S.overlay = { btns }; S.ovIdx = 0;
  const ov = document.getElementById('ov');
  ov.innerHTML = `<div class="card"><div class="meta">${c.logos[0]}<span>${fmt(it.start)}–${fmt(it.end)} · ${Math.round(it.end - it.start)} min</span></div>${it.series ? `<div class="cse">${esc(it.series)}</div>` : ''}<h2>${esc(it.title)}</h2><div class="st">${status}${!it.playable && !future ? ' · není k dispozici v archivu' : ''}${it.avail ? ' · dostupné do ' + it.avail : ''}</div><div class="btns">${btns.map((b, i) => `<div class="hbtn" data-i="${i}">${b}</div>`).join('')}</div></div>`;
  ov.hidden = false;
}
function closeDetail() { S.overlay = null; document.getElementById('ov').hidden = true; }
function overlayEnter() {
  const b = S.overlay.btns[S.ovIdx];
  if (b === 'Zavřít') { closeDetail(); return; }
  toast(b + ' (mimo prototyp)');
}

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
let itemEls = [];  // [{it, el, inner, gt}]
let laneEls = [], rowEls = [], logoEls = [];
function itemHTML(it) {
  if (it.kind === 'gap') return '<div class="gt">V tento čas nevysíláme…</div>';
  return `<div class="in"><div class="top"><span class="tm">${fmt(it.start)}</span><span class="ic${it.playable ? '' : ' x'}">${it.playable ? PLAY : PLAYX}</span></div>${it.series ? `<div class="se">${esc(it.series)}</div>` : ''}<div class="ti">${esc(it.title)}</div>${it.avail ? `<div class="av"><span>Dostupné do ${it.avail}</span></div>` : ''}</div>`;
}
function buildDOM() {
  const g = $('gtrack'); g.innerHTML = ''; g.style.width = DAY * PPM + 'px';
  itemEls = []; laneEls = []; rowEls = [];
  chans.forEach((c, ci) => {
    const row = document.createElement('div'); row.className = 'chrow'; g.appendChild(row); rowEls.push(row);
    laneEls[ci] = [];
    c.lanes.forEach((items, li) => {
      const lane = document.createElement('div'); lane.className = 'lane'; lane.style.top = li * PITCH + 'px'; row.appendChild(lane); laneEls[ci].push(lane);
      const frag = document.createDocumentFragment();
      for (const it of items) {
        const el = document.createElement('div');
        el.className = 'it' + (it.kind === 'gap' ? ' gap' : '');
        el.style.left = it.start * PPM + 'px';
        el.style.setProperty('--w', Math.max(2, (it.end - it.start) * PPM - GAP) + 'px');
        el.innerHTML = itemHTML(it);
        frag.appendChild(el);
        itemEls.push({ it, el, inner: el.firstChild, w: (it.end - it.start) * PPM - GAP });
      }
      lane.appendChild(frag);
    });
  });
  const lg = $('logos'); lg.innerHTML = ''; logoEls = [];
  chans.forEach(c => {
    const wrap = document.createElement('div');
    wrap.innerHTML = c.def.logos.map((s, i) => `<div class="logo" data-i="${i}">${s}</div>`).join('');
    const els = [...wrap.children]; els.forEach(e => lg.appendChild(e)); logoEls.push(els);
  });
  const tt = $('ttrack'); tt.style.width = DAY * PPM + 'px';
  let h = '';
  for (let t = 0; t <= DAY; t += 60) h += `<div class="hour" style="left:${t * PPM + 11}px">${fmt(t % DAY)}</div>`;
  if (isToday()) h += `<div class="nowlbl" style="left:${NOW * PPM}px">${fmt(NOW)}</div><div class="nowarrow" style="left:${NOW * PPM}px">${ARROW}</div><div class="nowline" style="left:${NOW * PPM}px"></div>`;
  tt.innerHTML = h;
  buildHeader();
}
function buildHeader() {
  $('header').innerHTML =
    `<div class="hbtn back" data-h="0">${BACK}<span>Zpět</span></div>` +
    `<div class="days">${DAYS.map((d, i) => `<div class="hbtn day${i === S.day ? ' sel' : ''}" data-h="${i + 1}"><span class="d1">${d[0]}</span><span class="d2">${d[1]}</span></div>`).join('')}` +
    `<div class="hbtn other" data-h="9">${CAL}<span>Jiné datum</span></div></div>` +
    `<div class="divider"></div>` +
    `<div class="anchors">${HEAD.slice(10).map((a, i) => `<div class="hbtn anchor" data-h="${i + 10}">${a.label}</div>`).join('')}</div>`;
}

function render() {
  const tx = `translateX(${-S.vs * PPM}px)`;
  $('gtrack').style.transform = tx; $('ttrack').style.transform = tx;
  $('rows').style.transform = `translateY(${-S.scrollY}px)`;
  $('logos').style.transform = `translateY(${-S.scrollY}px)`;
  const vs = S.vs, ve = vEnd(), today = isToday();
  // lanes with a visible programme
  const laneHasProg = chans.map(c => c.lanes.map(items => items.some(it => it.kind === 'prog' && it.end > vs && it.start < ve)));
  chans.forEach((c, ci) => {
    rowEls[ci].style.top = c.top + 'px'; rowEls[ci].style.height = c.height + 'px';
    if (c.def.id === 'sportplus') { const bg = $('spbg'); bg.style.top = c.top + 'px'; bg.style.height = c.height + 'px'; }
    laneEls[ci].forEach((el, li) => el.classList.toggle('off', li >= c.laneCount));
    const logos = logoEls[ci];
    if (logos.length === 1) logos[0].style.top = (c.top + 36) + 'px';
    else { logos[0].style.top = (c.top + 18) + 'px'; logos[1].style.top = (c.top + 54) + 'px'; }
  });
  for (const o of itemEls) {
    const it = o.it, el = o.el;
    const f = S.area === 'grid' && S.item === it && !S.overlay;
    el.classList.toggle('f', f);
    if (it.kind === 'prog') {
      el.classList.toggle('now', today && it.start <= NOW && NOW < it.end);
      el.classList.toggle('cut', it.start < vs - 0.01);   // started before the visible window
      const off = vs * PPM - it.start * PPM;
      o.inner.style.transform = off > 0 ? `translateX(${Math.min(off, Math.max(0, o.w - 120))}px)` : '';
    } else {
      const a = Math.max(it.start, vs), b = Math.min(it.end, ve);
      const show = b > a && (b - a) * PPM > 260 && (f || !laneHasProg[it.ch][it.lane]);
      o.inner.style.display = show ? '' : 'none';
      if (show) o.inner.style.left = (((a + b) / 2 - it.start) * PPM) + 'px';
    }
  }
  for (const o of itemEls) if (o.el.style.translate) o.el.style.translate = '';
  const fo = S.area === 'grid' && !S.overlay && itemEls.find(o => o.it === S.item && o.it.kind === 'prog');
  if (fo) {
    const left = fo.it.start * PPM, w = fo.el.offsetWidth, right = ve * PPM - 4;
    if (w > fo.w + 1 && left + w > right) fo.el.style.translate = Math.max(vs * PPM - left, right - (left + w)) + 'px 0';
  }
  document.querySelectorAll('#header .hbtn').forEach(el => el.classList.toggle('f', S.area === 'header' && !S.overlay && +el.dataset.h === S.hIdx));
  if (S.overlay) document.querySelectorAll('#ov .hbtn').forEach(el => el.classList.toggle('f', +el.dataset.i === S.ovIdx));
}

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hide'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 1800); }

/* ---------- Keys ---------- */
const BACK_KEYS = new Set(['Backspace', 'Escape', 'GoBack', 'BrowserBack', 'XF86Back']);
function onKey(e) {
  $('clickhint').hidden = true;
  let k = e.key;
  if (e.keyCode === 461 || e.keyCode === 10009) k = 'Escape';
  const isBack = BACK_KEYS.has(k), isEnter = k === 'Enter' || k === ' ';
  if (!isBack && !isEnter && !k.startsWith('Arrow')) return;
  e.preventDefault();
  if (S.overlay) {
    if (isBack) closeDetail();
    else if (isEnter) overlayEnter();
    else if (k === 'ArrowLeft') S.ovIdx = Math.max(0, S.ovIdx - 1);
    else if (k === 'ArrowRight') S.ovIdx = Math.min(S.overlay.btns.length - 1, S.ovIdx + 1);
  } else if (S.area === 'header') {
    if (k === 'ArrowLeft') S.hIdx = Math.max(0, S.hIdx - 1);
    else if (k === 'ArrowRight') S.hIdx = Math.min(HEAD.length - 1, S.hIdx + 1);
    else if (k === 'ArrowDown') enterGrid();
    else if (isEnter) headerEnter();
    else if (isBack) location.href = 'index.html';
  } else {
    if (k === 'ArrowLeft') moveH(-1);
    else if (k === 'ArrowRight') moveH(1);
    else if (k === 'ArrowUp') moveV(-1);
    else if (k === 'ArrowDown') moveV(1);
    else if (isEnter) { if (S.item.kind === 'prog') openDetail(S.item); else toast('V tento čas se nevysílá'); }
    else if (isBack) goHeader();
  }
  render();
}

/* ---------- Fit stage ---------- */
function fit() {
  const box = $('fit').getBoundingClientRect();
  const sc = Math.min(box.width / 1280, box.height / 720);
  $('stage').style.transform = `translate(-50%, -50%) scale(${sc})`;
  $('stage').style.transformOrigin = 'center center';
}

/* ---------- Init ---------- */
buildModel(S.day);
buildDOM();
S.vs = defaultVs(NOW);
computeLayout();
S.ch = 0; S.lane = 0; S.item = itemAt(0, 0, NOW); S.ref = NOW;
ensureRowVisible();
render();
fit();
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe($('fit'));
document.addEventListener('keydown', onKey);
const stage = $('stage'), ch = $('clickhint');
const upd = () => { ch.hidden = document.hasFocus(); };
window.addEventListener('focus', upd); window.addEventListener('blur', upd);
ch.addEventListener('click', () => { stage.focus(); upd(); });
stage.addEventListener('click', () => stage.focus());
setTimeout(() => { stage.focus(); upd(); }, 50);
window.__epg = { S, chans, render, onKey };
})();
</script>
